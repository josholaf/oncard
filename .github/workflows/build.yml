name: Build Oncard (Android + Windows)

on:
  push:
    branches: [main, 'v*', 'release/*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - name: Generate Android platform folder
        # Play Store rejects com.example.* ids, so publish under dev.josh.
        run: flutter create --platforms=android --org dev.josh --project-name=oncard .

      - name: Set app display name to Oncard
        run: sed -i 's/android:label="oncard"/android:label="Oncard"/' android/app/src/main/AndroidManifest.xml

      - name: Raise Kotlin and compileSdk for widget plugin
        # home_widget 0.9.x is written in Kotlin 2.1; the template
        # generated by Flutter 3.24.5 pins a Kotlin 1.8 compiler.
        run: |
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "2.1.20"/' android/settings.gradle
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
          grep -q '2.1.20' android/settings.gradle || (echo 'kotlin patch failed' && exit 1)

      - name: Wire text-selection quick add
        run: python3 scripts/setup_process_text.py

      - name: Wire home-screen widget
        run: python3 scripts/setup_widgets.py

      - name: Render app icon from logo.svg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin imagemagick
          for size in 48 72 96 144 192 256; do
            rsvg-convert -w $size -h $size assets/logo.svg -o icon$size.png
          done
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            size=${d#*:}; dir=${d%:*}
            cp icon$size.png android/app/src/main/res/mipmap-$dir/ic_launcher.png
            cp icon$size.png android/app/src/main/res/mipmap-$dir/ic_launcher_round.png
          done
          convert -background none icon256.png -define icon:auto-resize=256,128,64,48,32,16 app_icon.ico

      - uses: actions/upload-artifact@v4
        with:
          name: app-icon-ico
          path: app_icon.ico

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: oncard-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build signed app bundle for Play Store
        if: github.ref_name != 'main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets configured, skipping AAB build."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
          python3 scripts/setup_android_signing.py
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab Oncard-Play.aab

      - name: Publish GitHub release with APK
        if: github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Oncard.apk
          VERSION="${GITHUB_REF_NAME#release/}"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" Oncard.apk --clobber
          else
            gh release create "$VERSION" \
              --target "${GITHUB_SHA}" \
              --title "Oncard $VERSION" \
              --generate-notes \
              Oncard.apk
          fi
          if [ -f Oncard-Play.aab ]; then
            gh release upload "$VERSION" Oncard-Play.aab --clobber
          fi

  windows:
    if: github.ref_name != 'main'
    needs: build
    # Pin the 2022 image: it ships the Visual Studio toolchain that
    # Flutter 3.24.5 expects. windows-latest moved on to a newer one.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate Windows platform folder
        run: flutter create --platforms=windows --project-name=oncard .

      - uses: actions/download-artifact@v4
        with:
          name: app-icon-ico

      - name: Set app icon
        shell: bash
        run: cp app_icon.ico windows/runner/resources/app_icon.ico

      - run: flutter build windows --release

      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'Oncard-Windows-x64.zip'

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = "${env:GITHUB_REF_NAME}".Replace('release/', '').TrimStart('v')
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$version" 'scripts\oncard.iss'

      - name: Attach Windows build to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 12); do
            gh release upload "${GITHUB_REF_NAME#release/}" Oncard-Windows-x64.zip --clobber && break
            sleep 30
          done
          for i in $(seq 1 12); do
            gh release upload "${GITHUB_REF_NAME#release/}" installer/Oncard-Setup.exe --clobber && exit 0
            sleep 30
          done
          echo "installer upload failed" >&2
          exit 1
