name: Build APK

on:
  push:
    branches: [main, 'v*']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - name: Generate Android platform folder
        run: flutter create --platforms=android --project-name=oncard .

      - name: Set app display name to Oncard
        run: sed -i 's/android:label="oncard"/android:label="Oncard"/' android/app/src/main/AndroidManifest.xml

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: oncard-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub release with APK
        if: github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --target "${GITHUB_SHA}" \
            --title "Oncard ${GITHUB_REF_NAME}" \
            --generate-notes \
            build/app/outputs/flutter-apk/app-release.apk
