name: oncard
description: oncard — Study smarter, remember longer. Beautiful offline-first flashcard app for medicine, languages, programming and more.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  csv: ^6.0.0
  google_fonts: ^6.2.1
  provider: ^6.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
